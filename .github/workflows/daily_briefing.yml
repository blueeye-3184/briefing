name: Daily Gemini-Notion Briefing (KST Optimized)

on:
  pull_request:
    branches:
      - main
  schedule:
    # 매일 한국 시간(KST) 오전 08:17에 실행 (UTC 23:17)
    - cron: '17 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-briefing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Unit Test & Verification Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (node24)
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Unit Tests
        run: |
          python -m pytest -q

      - name: Check Git Diff Cleanliness
        run: |
          git diff --check

  briefing:
    name: Run Daily Briefing
    needs: test
    if: >-
      ${{ needs.test.result == 'success' &&
          (
            github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' &&
             github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
          ) }}
    concurrency:
      group: daily-briefing-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (node24)
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-flight Secret Validation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PARENT_PAGE_ID: ${{ secrets.PARENT_PAGE_ID }}
        run: |
          MISSING=""
          [ -z "$GEMINI_API_KEY" ] && MISSING="${MISSING} GEMINI_API_KEY"
          [ -z "$NOTION_TOKEN" ] && MISSING="${MISSING} NOTION_TOKEN"
          [ -z "$PARENT_PAGE_ID" ] && MISSING="${MISSING} PARENT_PAGE_ID"
          if [ -n "$MISSING" ]; then
            echo "::error::Required secrets are missing:${MISSING}"
            exit 1
          fi

      - name: Run Daily Briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PARENT_PAGE_ID: ${{ secrets.PARENT_PAGE_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python briefing_auto.py

      - name: Upload Run Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        with:
          name: briefing-run-artifacts-${{ github.run_id }}
          path: |
            artifacts/run.log
            artifacts/manifest.json
            artifacts/*.png
          if-no-files-found: warn
